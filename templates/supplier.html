<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supplier Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-b from-green-50 to-blue-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-2xl font-bold text-blue-700">Supplier Dashboard</h1>
    <nav class="space-x-6">
      <a href="#" class="text-gray-600 hover:text-green-600 font-medium">Home</a>
      <a href="#" class="text-gray-600 hover:text-green-600 font-medium">My Listings</a>
      <a href="#" class="text-gray-600 hover:text-green-600 font-medium">Profile</a>
      <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold shadow">Logout</button>
    </nav>
  </header>
  
  <!-- Main Content -->
  <main class="p-6 max-w-6xl mx-auto">
    <!-- Upload Form -->
    <section class="bg-white rounded-2xl shadow-md p-8 mb-10">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
        Post New Stock
      </h2>
      <form class="grid md:grid-cols-3 gap-4">
        <input type="text" placeholder="Item Name" class="border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-200" />
        <input type="number" placeholder="Quantity (kg)" class="border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-200" />
        <input type="date" class="border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-200" />
        <div class="md:col-span-3">
          <button class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl font-semibold shadow-md">Upload Stock</button>
        </div>
      </form>
    </section>

    <!-- Listings -->
    <section>
      <h3 class="text-xl font-semibold text-gray-800 mb-6">📦 My Active Listings</h3>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Listing Card -->
        <div class="bg-white p-6 rounded-2xl shadow hover:shadow-lg transition duration-300">
          <h4 class="text-lg font-bold text-gray-800 mb-2">🥬 Spinach (10kg)</h4>
          <p class="text-sm text-gray-600">Highest bid: <span class="text-green-600 font-medium">₹18/kg</span></p>
          <p class="text-sm text-gray-600 mb-4">Status: <span class="text-blue-600 font-medium">Active</span></p>
          <div class="flex justify-between">
            <button class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-md font-semibold text-sm">Edit</button>
            <button class="bg-red-500 text-white px-4 py-2 rounded-md font-semibold text-sm hover:bg-red-600">Remove</button>
          </div>
        </div>

        <!-- Sample Listing 2 -->
        <div class="bg-white p-6 rounded-2xl shadow hover:shadow-lg transition duration-300">
          <h4 class="text-lg font-bold text-gray-800 mb-2">🍅 Tomatoes (20kg)</h4>
          <p class="text-sm text-gray-600">Highest bid: <span class="text-green-600 font-medium">₹22/kg</span></p>
          <p class="text-sm text-gray-600 mb-4">Status: <span class="text-blue-600 font-medium">Active</span></p>
          <div class="flex justify-between">
            <button class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-md font-semibold text-sm">Edit</button>
            <button class="bg-red-500 text-white px-4 py-2 rounded-md font-semibold text-sm hover:bg-red-600">Remove</button>
          </div>
        </div>

        <!-- Sample Listing 3 -->
        <div class="bg-white p-6 rounded-2xl shadow hover:shadow-lg transition duration-300">
          <h4 class="text-lg font-bold text-gray-800 mb-2">🥛 Milk (5L)</h4>
          <p class="text-sm text-gray-600">Highest bid: <span class="text-green-600 font-medium">₹30/L</span></p>
          <p class="text-sm text-gray-600 mb-4">Status: <span class="text-blue-600 font-medium">Active</span></p>
          <div class="flex justify-between">
            <button class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-md font-semibold text-sm">Edit</button>
            <button class="bg-red-500 text-white px-4 py-2 rounded-md font-semibold text-sm hover:bg-red-600">Remove</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="mt-16 py-6 text-center text-gray-500 text-sm">
    &copy; 2025 Leftover Bidding | Built to reduce food waste 🌱
  </footer>
</body>
</html>
