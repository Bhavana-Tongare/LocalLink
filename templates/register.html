<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md animate-fade-in">
      <h2 class="text-3xl font-extrabold mb-2 text-center text-[#2D3748]">Create Your Account</h2>
      <p class="text-center text-[#4A5568] mb-6">Register as a Vendor or Supplier</p>

      <form action="/register" method="POST" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Full Name</label>
          <input type="text" name="name" placeholder="John Doe"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Email</label>
          <input type="email" name="email" placeholder="you@example.com"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Phone Number</label>
          <input type="tel" name="phone" placeholder="+91-XXXXXXXXXX"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Password</label>
          <input type="password" name="password" placeholder="••••••••"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Register As</label>
          <select name="role" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <option value="">Select Role</option>
            <option value="supplier">Supplier</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-200 font-semibold">
          Register
        </button>
      </form>

      <p class="text-sm text-center mt-6 text-[#4A5568]">
        Already have an account?
        <a href="/supplier_login" class="text-blue-600 hover:underline font-medium">Login as Supplier</a> or
        <a href="/vendor_login" class="text-blue-600 hover:underline font-medium">Login as Vendor</a>
      </p>
    </div>
  </div>

  <style>
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
