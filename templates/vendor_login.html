<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendor Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md animate-fade-in">
      <h2 class="text-3xl font-extrabold mb-4 text-center text-[#2D3748]">Vendor Login</h2>
      <p class="text-center text-[#4A5568] mb-6">Access your vendor dashboard</p>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 px-4 py-2 rounded bg-{{ 'red' if category == 'danger' else 'green' }}-100 text-{{ 'red' if category == 'danger' else 'green' }}-800">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- LOGIN FORM -->
      <form action="{{ url_for('vendor_login') }}" method="POST" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Email</label>
          <input type="email" name="email" placeholder="vendor@example.com"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block mb-1 font-medium text-[#2D3748]">Password</label>
          <input type="password" name="password" placeholder="••••••••"
                 class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div class="flex items-center justify-between text-sm text-[#4A5568]">
          <label class="flex items-center">
            <input type="checkbox" class="mr-2"> Remember me
          </label>
          <a href="#" class="hover:underline text-blue-600">Forgot password?</a>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-200 font-semibold">
          Login
        </button>
      </form>

      <p class="text-sm text-center mt-6 text-[#4A5568]">
        Don’t have an account?
        <a href="/register" class="text-blue-600 hover:underline font-medium">Register here</a>
      </p>
    </div>
  </div>

  <style>
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>
